name: Release DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    env:
      PROJECT: Hideout.xcodeproj
      SCHEME: Hideout
      CONFIGURATION: Release

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned archive
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"
          base_version="${tag_version%%-*}"
          app_version="$(xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -showBuildSettings \
            | awk -F ' = ' '$1 ~ /MARKETING_VERSION/ { print $2; exit }')"

          if [[ "$app_version" != "$base_version" ]]; then
            echo "Tag $tag expects MARKETING_VERSION $base_version, found $app_version" >&2
            exit 1
          fi

          build_version="$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "BUILD_VERSION=$build_version" >> "$GITHUB_ENV"
          echo "Building Hideout $tag with build $build_version"

          signing_entitlements="Hideout/Hideout.entitlements"
          archive_settings=(
            "CURRENT_PROJECT_VERSION=$build_version"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
          )

          if [[ "$tag_version" == *-* || "$tag_version" == "0.2.2" ]]; then
            signing_entitlements="Hideout/HideoutDiagnostics.entitlements"
            archive_settings+=(SWIFT_ACTIVE_COMPILATION_CONDITIONS=HIDEOUT_DIAGNOSTICS)
          fi

          echo "SIGNING_ENTITLEMENTS=$signing_entitlements" >> "$GITHUB_ENV"

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Hideout.xcarchive" \
            "${archive_settings[@]}"

      - name: Seal app with an ad-hoc signature
        shell: bash
        run: |
          set -euo pipefail

          app_path="$RUNNER_TEMP/Hideout.xcarchive/Products/Applications/Hideout.app"
          test -d "$app_path"

          codesign \
            --force \
            --deep \
            --sign - \
            --options runtime \
            --entitlements "$SIGNING_ENTITLEMENTS" \
            "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Create DMG
        id: package
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          app_path="$RUNNER_TEMP/Hideout.xcarchive/Products/Applications/Hideout.app"
          staging_path="$RUNNER_TEMP/Hideout-dmg"
          dmg_path="$RUNNER_TEMP/Hideout-${tag}-build-${BUILD_VERSION}.dmg"

          test -d "$app_path"
          mkdir -p "$staging_path"
          ditto "$app_path" "$staging_path/Hideout.app"
          ln -s /Applications "$staging_path/Applications"

          hdiutil create \
            -volname "Hideout ${tag}" \
            -srcfolder "$staging_path" \
            -ov \
            -format UDZO \
            "$dmg_path"

          echo "dmg=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"
          base_version="${tag_version%%-*}"
          changelog_anchor="${base_version//./}"
          changelog_url="https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/CHANGELOG.md#${changelog_anchor}"
          changelog_section="$(awk -v version="$base_version" '
            $0 == "## [" version "]" { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md)"

          if [[ -z "$(printf '%s' "$changelog_section" | tr -d '[:space:]')" ]]; then
            echo "No changelog entry found for version $base_version" >&2
            exit 1
          fi

          release_notes=$(cat <<EOF
          The ${tag} DMG uses a sealed ad-hoc signature so macOS does not reject the downloaded app bundle as damaged.

          ## What's new in ${tag_version}

          ${changelog_section}

          ## Before you install

          - Release builds are not signed with an Apple Developer ID certificate or notarized.
          - macOS may require confirmation the first time you open a downloaded build.
          - Open the DMG and drag Hideout.app to /Applications.

          Requires macOS 27 or later.

          Full changelog: [CHANGELOG.md](${changelog_url})
          EOF
          )
          release_args=(
            "$tag"
            "${{ steps.package.outputs.dmg }}"
            --verify-tag
            --title "Hideout ${tag}"
            --notes "$release_notes"
          )

          if [[ "$tag" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
