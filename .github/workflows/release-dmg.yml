name: Release DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    env:
      PROJECT: Hideout.xcodeproj
      SCHEME: Hideout
      CONFIGURATION: Release

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned archive
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"
          base_version="${tag_version%%-*}"
          app_version="$(xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -showBuildSettings \
            | awk -F ' = ' '$1 ~ /MARKETING_VERSION/ { print $2; exit }')"

          if [[ "$app_version" != "$base_version" ]]; then
            echo "Tag $tag expects MARKETING_VERSION $base_version, found $app_version" >&2
            exit 1
          fi

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Hideout.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Seal app with an ad-hoc signature
        shell: bash
        run: |
          set -euo pipefail

          app_path="$RUNNER_TEMP/Hideout.xcarchive/Products/Applications/Hideout.app"
          test -d "$app_path"

          codesign \
            --force \
            --deep \
            --sign - \
            --options runtime \
            --entitlements Hideout/Hideout.entitlements \
            "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Create DMG
        id: package
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          app_path="$RUNNER_TEMP/Hideout.xcarchive/Products/Applications/Hideout.app"
          staging_path="$RUNNER_TEMP/Hideout-dmg"
          dmg_path="$RUNNER_TEMP/Hideout-${tag}.dmg"

          test -d "$app_path"
          mkdir -p "$staging_path"
          ditto "$app_path" "$staging_path/Hideout.app"
          ln -s /Applications "$staging_path/Applications"

          hdiutil create \
            -volname "Hideout ${tag}" \
            -srcfolder "$staging_path" \
            -ov \
            -format UDZO \
            "$dmg_path"

          echo "dmg=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"
          base_version="${tag_version%%-*}"
          changelog_anchor="${base_version//./}"
          changelog_url="https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/CHANGELOG.md#${changelog_anchor}"
          release_notes="$(cat <<EOF
          The ${tag} DMG uses a sealed ad-hoc signature so macOS does not reject the downloaded app bundle as damaged.

          ## What's new in ${tag_version}

          - The archived app is sealed with an ad-hoc signature before the DMG is created.

          ## Before you install

          - Release builds are not signed with an Apple Developer ID certificate or notarized.
          - macOS may require confirmation the first time you open a downloaded build.
          - Open the DMG and drag Hideout.app to /Applications.

          Requires macOS 27 or later.

          Full changelog: [CHANGELOG.md](${changelog_url})
          EOF
          )"
          release_args=(
            "$tag"
            "${{ steps.package.outputs.dmg }}"
            --verify-tag
            --title "Hideout ${tag}"
            --notes "$release_notes"
          )

          if [[ "$tag" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
